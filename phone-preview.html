<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .phone {
      position: relative;
      width: 393px;
      background: #000;
      border-radius: 54px;
      padding: 14px;
      box-shadow:
        0 0 0 2px #333,
        0 0 0 4px #555,
        0 30px 80px rgba(0,0,0,0.8);
    }

    /* Side buttons */
    .phone::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 130px;
      width: 4px;
      height: 36px;
      background: #444;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 52px 0 #444, 0 96px 0 #444;
    }
    .phone::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 170px;
      width: 4px;
      height: 72px;
      background: #444;
      border-radius: 0 2px 2px 0;
    }

    .screen {
      background: #fff;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      height: 852px;
    }

    /* Dynamic island */
    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    iframe {
      width: 375px;
      height: 852px;
      border: none;
      display: block;
    }

    .label {
      color: #666;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div>
    <div class="phone">
      <div class="screen">
        <div class="dynamic-island"></div>
        <iframe src="index.html" title="Portfolio preview"></iframe>
      </div>
    </div>
    <p class="label">pragyakothari.com — mobile preview</p>
  </div>
</body>
</html>
